[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jabfy-core"
version = "0.1.0"
description = "Local-first Smart Home orchestration core for JABFY"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.23,<5.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jabfy-bus[mqtt] @ https://github.com/jabfy-corp/jabfy-bus/archive/c99d086c1189d60c75dbd9f68e1ef10e1b41f731.tar.gz",
    "jabfy-guard @ https://github.com/jabfy-corp/jabfy-guard/archive/533c144b0049de74dfb1c185de77531ada3b6bd5.tar.gz",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
