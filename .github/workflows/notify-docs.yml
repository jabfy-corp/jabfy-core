name: Notify docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]

jobs:
  notify:
    name: Prévenir jabfy-docs
    runs-on: ubuntu-latest
    steps:
      - name: Send docs-updated event
        env:
          # PAT fine-grained « Contents: write » sur jabfy-docs (secret à créer dans ce repo).
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jabfy-corp/jabfy-docs/dispatches \
            -d '{"event_type":"docs-updated"}'
