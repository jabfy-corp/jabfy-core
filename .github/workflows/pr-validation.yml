name: Validate PR-Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR is linked to an existing issue
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_data=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json closingIssuesReferences)
          linked_issues=$(jq -r '(.closingIssuesReferences // []) | length' <<< "$pr_data")

          if (( linked_issues == 0 )); then
            echo "ERROR: Pull request must be linked to an existing issue."
            echo "Use a closing keyword in the PR body, e.g.: Closes #123"
            exit 1
          fi

          echo "PR is linked to $linked_issues issue(s). Validation passed."
